<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TS Chat| Acesso Exclusivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f9f9f9; color: #1a1a1a; }
    .auth-card { background: #ffffff; border: 1px solid #eaeaea; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    .input-field { background: #fcfcfc; border: 1px solid #e5e5e5; transition: 0.3s; }
    .input-field:focus { border-color: #ef4444; outline: none; }
    .btn-gradient { background: #1a1a1a; transition: 0.3s; cursor: pointer; }
    .btn-gradient:hover { background: #000; }
    button { cursor: pointer !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-10 cursor-pointer" onclick="checkAdminClick()">
      <h1 class="text-4xl font-extrabold tracking-tighter uppercase italic text-black">TS<span class="text-red-600">Chats</span></h1>
      <p class="text-neutral-400 text-xs mt-2 uppercase tracking-[0.3em]">Ambiente Seguro & Privado</p>
    </div>

    <div class="auth-card p-8 rounded-3xl">
      <div class="space-y-4">
        <input type="email" id="email" placeholder="E-mail" class="input-field w-full p-4 rounded-xl text-sm text-black">
        <input type="password" id="password" placeholder="Senha" class="input-field w-full p-4 rounded-xl text-sm text-black">
        <button id="btn-entrar" class="btn-gradient w-full py-4 rounded-xl font-bold uppercase tracking-wider text-sm text-white">Entrar agora</button>
      </div>

      <div class="mt-6 pt-6 border-t border-neutral-100">
        <p class="text-[10px] text-center text-neutral-400 mb-3 uppercase tracking-widest font-bold">Ainda não tem conta?</p>
        <div class="flex gap-2">
          <a href="cadastro.html?tipo=cliente" class="flex-1 py-3 text-[10px] font-bold text-center bg-neutral-100 hover:bg-neutral-200 rounded-xl transition uppercase">Criar Conta Cliente</a>
          <a href="cadastro.html?tipo=modelo" class="flex-1 py-3 text-[10px] font-bold text-center bg-neutral-100 hover:bg-neutral-200 rounded-xl transition uppercase">Criar Conta Modelo</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const client = supabase.createClient(
      'https://nunyvnqtvmjqurgctxml.supabase.co',
      'sb_publishable_En9cX-NAv4AVOhNcjGVcow_IOvSYCFl'
    );
    
    document.getElementById('btn-entrar').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        return alert("Por favor, preencha e-mail e senha.");
      }

      try {
        // 1. Tentar Login
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;

        // 2. Buscar tipo no banco
        const { data: userProfile, error: profileError } = await client
          .from('usuarios')
          .select('tipo')
          .eq('id', data.user.id)
          .single();

        if (profileError || !userProfile) {
          throw new Error("Perfil não encontrado. Tente se cadastrar novamente.");
        }

        // 3. Redirecionamento Inteligente
        const tipo = userProfile.tipo.toLowerCase();
        
        if (tipo === 'modelo') {
            window.location.href = 'dashboard-modelo.html';
        } else {
            window.location.href = 'dashboard-cliente.html';
        }
        
      } catch (err) {
        console.error("Erro:", err);
        alert("Erro no Login: " + err.message);
      }
    };

    let clicks = 0;
    function checkAdminClick() {
      clicks++;
      if(clicks === 3) window.location.href = 'admin-login.html';
    }
  </script>
</body>
</html>
