<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { height: 100dvh; }
    #modal-zoom { transition: opacity 0.3s ease, visibility 0.3s ease; }
    #modal-zoom.hidden { opacity: 0; visibility: hidden; display: flex !important; }
    #chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
  </style>
</head>
<body class="bg-[#050505] text-white flex overflow-hidden">

  <aside class="hidden md:flex w-64 bg-[#0d0d0d] p-6 border-r border-white/10 flex-col z-10">
    <h1 class="text-xl font-black mb-8"><span class="text-white">TS</span><span class="text-red-500"> CHATS</span></h1>
    <div id="container-foto" class="mb-6 hidden group cursor-pointer" onclick="abrirZoom()">
        <img id="sala-foto-display" src="" class="w-full h-32 object-cover rounded-xl border border-white/10 shadow-lg">
    </div>
    <div id="menu-salas" class="space-y-2 flex-1 overflow-y-auto pr-2">
      <p class="text-[10px] uppercase text-zinc-500 font-bold mb-4">Minhas Salas</p>
    </div>
    <button onclick="window.location.href='index.html'" class="text-zinc-500 text-sm font-bold hover:text-white mt-4">← Voltar</button>
  </aside>

  <main class="flex-1 flex flex-col bg-[#070707] w-full">
    <header class="border-b border-white/10 bg-[#080808] p-4 flex items-center justify-between">
      <div>
        <h2 id="titulo-sala" class="font-bold text-sm md:text-lg truncate">Selecione uma sala</h2>
        <div id="status-online" class="text-[10px] text-green-500 font-mono"></div>
      </div>
      <button id="btn-encerrar" onclick="encerrarSala()" class="hidden bg-red-600/10 text-red-500 px-3 py-1 rounded-xl text-[10px] font-bold border border-red-600/20">ENCERRAR</button>
    </header>

    <div id="container-foto-mobile" class="md:hidden p-4 pb-0 hidden">
        <img id="sala-foto-display-mobile" src="" class="w-full h-24 object-cover rounded-xl border border-white/10" onclick="abrirZoom()">
    </div>

    <div id="chat-container" class="p-4"></div>

    <form id="chat-form" class="p-3 bg-[#090909] border-t border-white/10 flex gap-2 items-center hidden">
      <input type="file" id="foto-input" accept="image/*" class="hidden" onchange="enviarArquivo(this)">
      <button type="button" onclick="document.getElementById('foto-input').click()" class="text-zinc-500 text-xl">📸</button>
      <button type="button" id="btn-audio" onclick="toggleAudio()" class="text-zinc-500 text-xl">🎙️</button>
      <input id="message-input" class="flex-1 bg-[#151515] rounded-2xl px-4 py-2 outline-none border border-white/5" placeholder="Mensagem...">
      <button class="bg-red-600 px-4 py-2 rounded-2xl font-bold text-sm">Enviar</button>
    </form>
  </main>

  <div id="modal-zoom" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4" onclick="fecharZoom()">
      <img id="foto-zoom-display" src="" class="max-w-full max-h-full rounded-2xl border border-white/10">
  </div>

  <script>
    const client = supabase.createClient('https://nunyvnqtvmjqurgctxml.supabase.co', 'sb_publishable_En9cX-NAv4AVOhNcjGVcow_IOvSYCFl');
    const params = new URLSearchParams(window.location.search);
    const salaAtual = params.get('sala');
    let canal = null, mediaRecorder, audioChunks = [];

    window.onload = () => {
        const salas = JSON.parse(localStorage.getItem('minhas_salas') || '[]');
        if (salaAtual && !salas.includes(salaAtual)) { window.location.href = "index.html"; return; }
        
        if(salaAtual) {
            document.getElementById('titulo-sala').innerText = localStorage.getItem('nome_' + salaAtual) || "Sala Privada";
            document.getElementById('chat-form').classList.remove('hidden');
            
            const foto = localStorage.getItem('foto_' + salaAtual);
            if(foto) {
                document.getElementById('sala-foto-display').src = foto;
                document.getElementById('sala-foto-display-mobile').src = foto;
                document.getElementById('foto-zoom-display').src = foto;
                document.getElementById('container-foto').classList.remove('hidden');
                document.getElementById('container-foto-mobile').classList.remove('hidden');
            }
            
            canal = client.channel(salaAtual);
            canal.on('presence', { event: 'sync' }, () => {
                const count = Object.keys(canal.presenceState()).length;
                document.getElementById('status-online').innerText = count > 1 ? `${count} pessoas online` : "1 online";
            }).subscribe(async (s) => { if(s === 'SUBSCRIBED') await canal.track({}); });

            canal.on('broadcast', { event: 'msg' }, (p) => render(p.payload.html, false)).subscribe();
            if(params.get('tipo') === 'modelo') document.getElementById('btn-encerrar').classList.remove('hidden');
        }
    };

    function abrirZoom() { document.getElementById('modal-zoom').classList.remove('hidden'); }
    function fecharZoom() { document.getElementById('modal-zoom').classList.add('hidden'); }
    function render(html, mine) {
        const div = document.createElement('div');
        div.className = `flex ${mine ? 'justify-end' : 'justify-start'}`;
        div.innerHTML = `<div class="p-4 rounded-3xl ${mine ? 'bg-red-600' : 'bg-zinc-800'} max-w-[80%]">${html}</div>`;
        const container = document.getElementById('chat-container');
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
    // ... restante das funções (toggleAudio, enviarArquivo, etc) mantêm-se iguais
  </script>
</body>
</html>
