<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* CSS Base para forçar o layout correto */
    html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background: #050505; color: white; }
    #app-wrapper { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    
    #chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; -webkit-overflow-scrolling: touch; }
    
    /* Z-index elevados para elementos clicáveis e sidebar */
    button, input, #container-foto-mobile { position: relative; z-index: 20; }
    #modal-zoom { display: none; }
    #modal-zoom.active { display: flex !important; }

    /* Estilos específicos para a Sidebar Mobile e botões */
    #sidebar-menu.show { display: flex !important; z-index: 50; }
    #sidebar-menu { display: none; } /* Começa escondido no mobile */
    @media (min-width: 768px) { #sidebar-menu { display: flex !important; } } /* Mostra no desktop */

    /* Garante que o fundo da sidebar mobile seja opaco */
    #sidebar-menu-inner { background-color: #0d0d0d !important; }

    /* Estilo para botões de menu e fechar ficarem no topo e com cor de destaque */
    #btn-mobile-menu, #btn-mobile-close {
        z-index: 60; /* Acima de tudo */
        color: #ef4444; /* Vermelho-500 do Tailwind */
        cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="app-wrapper">
      <aside id="sidebar-menu" class="hidden md:flex w-64 bg-[#0d0d0d] p-6 border-r border-white/10 flex-col">
        <div id="sidebar-menu-inner" class="flex flex-col h-full">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-xl font-black"><span class="text-white">TS</span><span class="text-red-500"> CHATS</span></h1>
                <button id="btn-mobile-close" class="md:hidden p-2" onclick="toggleMenu(false)">✕</button>
            </div>
            <div id="container-foto" class="mb-6 hidden cursor-pointer" onclick="abrirZoom()">
                <img id="sala-foto-display" src="" class="w-full h-32 object-cover rounded-xl border border-white/10">
            </div>
            <div id="menu-salas" class="space-y-2 flex-1 overflow-y-auto"></div>
            <button onclick="window.location.href='index.html'" class="text-zinc-500 text-sm font-bold mt-4 hover:text-white">← Voltar</button>
        </div>
      </aside>

      <main class="flex-1 flex flex-col w-full bg-[#070707]">
        <header class="h-16 border-b border-white/10 flex items-center px-4 justify-between bg-[#080808]">
          <div class="flex items-center gap-2">
            <button id="btn-mobile-menu" class="md:hidden p-2 text-red-500" onclick="toggleMenu(true)">☰</button>
            <div>
              <h2 id="titulo-sala" class="font-bold text-sm truncate">Selecione uma sala</h2>
              <div id="status-online" class="text-[10px] text-green-500 font-mono"></div>
            </div>
          </div>
          <button id="btn-encerrar" onclick="encerrarSala()" class="hidden bg-red-600/10 text-red-500 px-3 py-1 rounded-xl text-[10px] border border-red-600/20">ENCERRAR</button>
        </header>

        <div id="container-foto-mobile" class="md:hidden p-4 pb-0 hidden">
            <img id="sala-foto-display-mobile" src="" class="w-full h-24 object-cover rounded-xl border border-white/10" onclick="abrirZoom()">
        </div>

        <div id="chat-container"></div>

        <form id="chat-form" class="p-3 bg-[#090909] border-t border-white/10 flex gap-3 items-center hidden">
          <input type="file" id="foto-input" accept="image/*" class="hidden" onchange="enviarArquivo(this)">
          <button type="button" onclick="document.getElementById('foto-input').click()" class="text-white text-2xl hover:text-red-500">📸</button>
          <button id="btn-audio" type="button" onclick="toggleAudio()" class="text-white text-2xl hover:text-red-500">🎙️</button>
          <input id="message-input" class="flex-1 bg-[#151515] rounded-xl px-4 py-3 outline-none text-white border border-white/5" placeholder="Mensagem...">
          <button type="submit" class="bg-red-600 px-5 py-3 rounded-xl font-bold text-sm hover:bg-red-700">Enviar</button>
        </form>
      </main>
  </div>

  <div id="modal-zoom" class="fixed inset-0 bg-black/95 z-[100] items-center justify-center p-4" onclick="fecharZoom()">
      <img id="foto-zoom-display" src="" class="max-w-full max-h-full rounded-xl">
  </div>

  <script>
    const client = supabase.createClient('https://nunyvnqtvmjqurgctxml.supabase.co', 'sb_publishable_En9cX-NAv4AVOhNcjGVcow_IOvSYCFl');
    const params = new URLSearchParams(window.location.search);
    const salaAtual = params.get('sala');
    let canal = null, mediaRecorder, audioChunks = [];

    // Função para controlar a sidebar mobile
    function toggleMenu(show) {
        const menu = document.getElementById('sidebar-menu');
        if (show) { menu.classList.add('show'); } 
        else { menu.classList.remove('show'); }
    }

    window.onload = () => {
        const menuSalas = document.getElementById('menu-salas');
        const salas = JSON.parse(localStorage.getItem('minhas_salas') || '[]');
        if (salaAtual && !salas.includes(salaAtual)) { window.location.href = "index.html"; return; }

        salas.forEach(id => {
            const btn = document.createElement('button');
            btn.className = `w-full text-left p-3 rounded-xl text-sm ${id === salaAtual ? 'bg-red-600 text-white' : 'text-zinc-500 hover:bg-white/5'}`;
            btn.innerText = localStorage.getItem('nome_' + id) || "Sessão";
            btn.onclick = () => window.location.href = `chat.html?sala=${id}&tipo=modelo`;
            menuSalas.appendChild(btn);
        });

        if(salaAtual) {
            document.getElementById('titulo-sala').innerText = localStorage.getItem('nome_' + salaAtual) || "Sala Privada";
            document.getElementById('chat-form').classList.remove('hidden');
            canal = client.channel(salaAtual, { config: { broadcast: { ack: true } } });
            canal.on('broadcast', { event: 'msg' }, (p) => render(p.payload.html, false)).subscribe();
            
            const foto = localStorage.getItem('foto_' + salaAtual);
            if(foto) {
                document.getElementById('sala-foto-display').src = foto;
                document.getElementById('sala-foto-display-mobile').src = foto;
                document.getElementById('foto-zoom-display').src = foto;
                document.getElementById('container-foto').classList.remove('hidden');
                document.getElementById('container-foto-mobile').classList.remove('hidden');
            }
            if(params.get('tipo') === 'modelo') document.getElementById('btn-encerrar').classList.remove('hidden');
        }
    };

    function render(html, mine) {
        const div = document.createElement('div');
        div.className = `flex ${mine ? 'justify-end' : 'justify-start'}`;
        div.innerHTML = `<div class="p-4 rounded-3xl ${mine ? 'bg-red-600' : 'bg-zinc-800'} text-sm max-w-[85%]">${html}</div>`;
        const container = document.getElementById('chat-container');
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    document.getElementById('chat-form').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('message-input');
        if(!input.value.trim()) return;
        render(`<p>${input.value}</p>`, true);
        await canal.send({ type: 'broadcast', event: 'msg', payload: { html: `<p>${input.value}</p>` } });
        input.value = '';
    };

    function toggleAudio() { console.log('Áudio...'); /* Adicione lógica de áudio aqui se necessário */ }
    function enviarArquivo(input) { const reader = new FileReader(); reader.onload = (e) => { const html = `<img src="${e.target.result}" class="max-w-[200px] rounded-lg">`; render(html, true); canal.send({ type: 'broadcast', event: 'msg', payload: { html } }); }; reader.readAsDataURL(input.files[0]); }
    function abrirZoom() { document.getElementById('modal-zoom').classList.add('active'); }
    function fecharZoom() { document.getElementById('modal-zoom').classList.remove('active'); }
    function encerrarSala() { if(confirm("Encerrar?")) window.location.href = "index.html"; }
  </script>
</body>
</html>
