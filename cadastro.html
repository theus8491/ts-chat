<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS CHATS | Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #18181b; color: white; }
        .auth-card { background: #27272a; border: 1px solid #3f3f46; box-shadow: 0 15px 40px rgba(0,0,0,.35); }
        .input-field { width: 100%; padding: 16px; border-radius: 12px; background: #3f3f46; border: 1px solid #52525b; color: white; }
        .input-field:focus { border-color: #dc2626; outline: none; }
        .btn-gradient { background: #dc2626; transition: .3s; cursor: pointer; }
        .btn-gradient:hover { background: #b91c1c; }
        .tag-btn { background: transparent; border: 1px solid #52525b; color: #a1a1aa; transition: 0.3s; }
        .tag-btn.active { background: rgba(220, 38, 38, 0.2); border-color: #dc2626; color: #f87171; }
        .val-box { background: #3f3f46; border: 1px solid #52525b; border-radius: 8px; padding: 8px; text-align: center; }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-5xl font-extrabold tracking-tighter uppercase italic">TS<span class="text-red-600">Prive</span></h1>
    </div>

    <div class="auth-card p-8 rounded-3xl">
        <div class="flex flex-col items-center mb-6">
            <label for="foto" class="cursor-pointer">
                <div class="w-32 h-32 rounded-full bg-neutral-700 border-4 border-neutral-600 overflow-hidden">
                    <img id="preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-full h-full object-cover">
                </div>
            </label>
            <input type="file" id="foto" accept="image/*" class="hidden">
        </div>

        <div class="flex flex-wrap justify-center gap-2 mb-6" id="tag-container">
            <button type="button" class="tag-btn px-3 py-1 rounded-full text-xs" data-value="troco fotos">📸 Troco fotinhas</button>
            <button type="button" class="tag-btn px-3 py-1 rounded-full text-xs" data-value="amizade">🤝 Apenas amizade</button>
            <button type="button" class="tag-btn px-3 py-1 rounded-full text-xs" data-value="web namoro">💻 Web namoro</button>
        </div>

        <div class="mb-6">
            <p class="text-[10px] text-neutral-400 font-bold uppercase mb-2">Valores (R$)</p>
            <div class="grid grid-cols-3 gap-2">
                <div class="val-box"><p class="text-[9px] mb-1">10 min</p><input type="number" id="v10" class="w-full bg-transparent text-center text-sm" placeholder="00"></div>
                <div class="val-box"><p class="text-[9px] mb-1">20 min</p><input type="number" id="v20" class="w-full bg-transparent text-center text-sm" placeholder="00"></div>
                <div class="val-box"><p class="text-[9px] mb-1">30 min</p><input type="number" id="v30" class="w-full bg-transparent text-center text-sm" placeholder="00"></div>
            </div>
        </div>

        <div class="space-y-4">
            <input type="text" id="nome" placeholder="Nome Completo" class="input-field">
            <input type="email" id="email" placeholder="E-mail" class="input-field">
            <input type="password" id="senha" placeholder="Senha" class="input-field">
            <select id="tipo" class="input-field">
                <option value="cliente">Cliente</option>
                <option value="modelo">Modelo</option>
            </select>
            <button id="btn-cadastrar" class="btn-gradient w-full py-4 rounded-xl font-bold uppercase tracking-wider text-sm text-white">Criar Conta</button>
        </div>
    </div>
</div>

<script>
    // Inicialização do Supabase
    const client = supabase.createClient(
        'https://nunyvnqtvmjqurgctxml.supabase.co',
        'sb_publishable_En9cX-NAv4AVOhNcjGVcow_IOvSYCFl'
    );

    document.getElementById('foto').addEventListener('change', function(e){
        const arquivo = e.target.files[0];
        if(arquivo) {
            const leitor = new FileReader();
            leitor.onload = (event) => document.getElementById('preview').src = event.target.result;
            leitor.readAsDataURL(arquivo);
        }
    });

    let tagsSelecionadas = [];
    document.getElementById('tag-container').addEventListener('click', (e) => {
        const btn = e.target.closest('.tag-btn');
        if (!btn) return;
        btn.classList.toggle('active');
        const val = btn.getAttribute('data-value');
        if(tagsSelecionadas.includes(val)) {
            tagsSelecionadas = tagsSelecionadas.filter(t => t !== val);
        } else {
            tagsSelecionadas.push(val);
        }
    });

    document.getElementById('btn-cadastrar').onclick = async () => {
        const nome = document.getElementById('nome').value;
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const tipo = document.getElementById('tipo').value;
        
        const valores = {
            v10: document.getElementById('v10').value || '0',
            v20: document.getElementById('v20').value || '0',
            v30: document.getElementById('v30').value || '0'
        };

        if(!nome || !email || !senha) return alert('Preencha todos os campos.');

        try {
            // 1. Cria o usuário no Auth
            const { data, error } = await client.auth.signUp({ email, password: senha });
            if(error) throw error;

            // 2. Insere os detalhes na tabela 'usuarios'
            const { error: dbError } = await client.from('usuarios').insert([{
                id: data.user.id,
                nome: nome,
                email: email,
                tipo: tipo,
                tags: tagsSelecionadas,
                valores: valores
            }]);
            
            if(dbError) throw dbError;

            alert('Conta criada com sucesso!');
            window.location.href = 'index.html';
        } catch (err) {
            console.error(err);
            alert('Erro ao cadastrar: ' + err.message);
        }
    };
</script>
</body>
</html>|
